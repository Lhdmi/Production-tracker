# Blueprint Render — déploiement de démonstration (usage interne)
# Utilisation : https://dashboard.render.com/blueprints
# → « New Blueprint » → URL du repo GitHub (Lhdmi/Production-tracker)
services:
  - type: web
    name: production-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Les migrations + seed sont exécutées au démarrage du conteneur
    # (RUN_MIGRATIONS=true), idempotent, car le pre-deploy n'est pas
    # supporté sur le plan gratuit.
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: local
      - key: RUN_MIGRATIONS
        value: "true"
      - key: PUBLIC_URL
        value: ${RENDER_EXTERNAL_URL}
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: production-tracker-db
          property: connectionString

databases:
  - name: production-tracker-db
    plan: free
