# MODÈLE — copiez ce fichier en k8s/secret.yaml, remplissez les valeurs,
# puis appliquez. Ne committez jamais le fichier k8s/secret.yaml rempli.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # remplir les valeurs, puis :
#   kubectl apply -f k8s/namespace.yaml k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: production-tracker
  namespace: production-tracker
type: Opaque
stringData:
  # Générer avec : openssl rand -hex 32
  jwt-secret: "CHANGE_ME_une_chaine_longue_et_aleatoire"
  # Mot de passe PostgreSQL
  db-password: "CHANGE_ME_mot_de_passe_db"
