apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-tracker
  namespace: production-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: production-tracker
  template:
    metadata:
      labels:
        app: production-tracker
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: app
          image: registry.example.com/production-tracker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: production-tracker
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: production-tracker
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: production-tracker
                  key: jwt-secret
            - name: DATABASE_URL
              value: "postgres://postgres:$(DB_PASSWORD)@postgres:5432/production_tracker"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
  namespace: production-tracker
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: production-tracker
  namespace: production-tracker
spec:
  selector:
    app: production-tracker
  ports:
    - port: 80
      targetPort: 3001
